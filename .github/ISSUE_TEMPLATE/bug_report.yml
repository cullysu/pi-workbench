name: Bug 报告 / Bug report
description: 面板功能异常、启动失败、安装问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。pi-workbench 是本地单人工具，请勿粘贴 API Key / 会话内容等敏感信息。
  - type: dropdown
    id: platform
    attributes:
      label: 平台 / Platform
      options:
        - Windows (Electron 壳)
        - Windows (Tauri 壳)
        - Linux (AppImage)
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: "1.1.3"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: "~/.pi-workbench/server.log 的相关片段（注意脱敏）"
  - type: input
    id: node
    attributes:
      label: Node 版本 / Node version
      placeholder: "v22.13.0（桌面壳要求 ≥ 22.13）"
