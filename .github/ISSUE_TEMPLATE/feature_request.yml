name: 功能建议 / Feature request
description: 新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认 / Scope
      options:
        - label: 我理解本项目不 fork/修改 pi 本体，只做周边工作台
          required: true
