name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check electron-main.cjs
          node --check public/app.js
          node --check public/dropdowns.js
          node --check extensions/mcp-bridge.js
      - name: API tests
        run: npm test

  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build deps
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assemble runtime (pi + server + public)
        shell: pwsh
        run: |
          npm install --prefix pkg-build @earendil-works/pi-coding-agent@0.85.0 ws@8.21.3 --omit=dev --no-fund --no-audit
          Copy-Item server.mjs pkg-build/server.mjs
          Copy-Item zip.mjs pkg-build/zip.mjs
          Copy-Item electron-main.cjs pkg-build/electron-main.cjs
          Copy-Item extensions pkg-build/extensions -Recurse -Force
          robocopy public pkg-build/public /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          node scripts/make-runtime.mjs
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Tauri app
        shell: pwsh
        run: |
          cargo --version
          cd tauri
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-installer
          path: tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist_electron/*.exe
          retention-days: 7

  build-linux:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build deps
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assemble runtime (pi + server + public)
        run: |
          npm install --prefix pkg-build @earendil-works/pi-coding-agent@0.85.0 ws@8.21.3 --omit=dev --no-fund --no-audit
          cp server.mjs zip.mjs electron-main.cjs pkg-build/
          cp -r extensions pkg-build/extensions
          mkdir -p pkg-build/public
          cp -r public/. pkg-build/public/
          node scripts/make-runtime.mjs
      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Smoke test AppImage structure
        run: |
          f=(dist_electron/*.AppImage)
          chmod +x "${f[0]}"
          "${f[0]}" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          echo 'AppImage structure verified (AppRun executable)'
      - name: Boot test - shipped AppImage must serve the panel
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 xvfb curl
          f=(dist_electron/*.AppImage)
          timeout 90 xvfb-run -a "${f[0]}" --appimage-extract-and-run > /tmp/app.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:32123/ || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          pkill -f appimage-extract-and-run 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo 'BOOT FAILED - panel never answered 200'; tail -20 /tmp/app.log; exit 1; fi
          echo 'BOOT VERIFIED: the shipped AppImage served the panel (HTTP 200)'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist_electron/*.AppImage
          retention-days: 7

  build-mac:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build deps
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assemble runtime (pi + server + public)
        run: |
          npm install --prefix pkg-build @earendil-works/pi-coding-agent@0.85.0 ws@8.21.3 --omit=dev --no-fund --no-audit
          cp server.mjs zip.mjs electron-main.cjs pkg-build/
          cp -r extensions pkg-build/extensions
          mkdir -p pkg-build/public
          cp -r public/. pkg-build/public/
          node scripts/make-runtime.mjs
      - name: Build macOS dmg (arm64 + x64)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist_electron/*.dmg
          retention-days: 7
