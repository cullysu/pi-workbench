name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # bundled into every installer so users never need a system Node
  NODE_BUNDLE_VERSION: v22.21.0

jobs:
  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - name: Version identity across every manifest
        # v1.3.1 was tagged on a commit whose manifests still said 1.3.0, so the release
        # shipped assets named with the previous version. One cheap check makes that class
        # of mistake impossible: every file that carries the version must agree.
        run: node scripts/assert-version.mjs
      - name: Dependency audit (root tree)
        run: npm audit --omit=dev --audit-level=high
      # v1.4.3 review #27: this used to be `npm audit --audit-level=high` with
      # continue-on-error, i.e. a step that printed 5 highs and let the pipeline build and
      # upload installers anyway. A gate nobody can fail is a green light, not a check.
      # scripts/audit-gate.mjs fails on any high/critical advisory that is NOT named in
      # scripts/audit-baseline.json, and reports baseline entries that no longer apply.
      - name: Dependency audit (dev tree — hard gate against the reviewed baseline)
        run: node scripts/audit-gate.mjs
      - name: Dependency audit (shipped runtime tree)
        run: |
          rt="$RUNNER_TEMP/piwb-audit"
          mkdir -p "$rt"
          cp runtime-package.json "$rt/package.json"
          cp runtime-package-lock.json "$rt/package-lock.json"
          cd "$rt"
          npm ci --omit=dev --no-fund --no-audit
          npm audit --omit=dev --audit-level=high
      - name: Cargo audit (desktop shell deps)
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.62.5
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit --file tauri/Cargo.lock # the committed lock IS the audited AND built tree — no build-time updates
      # v1.4.3 review #28: the Rust step used to live HERE (an ubuntu job) behind
      # `if: runner.os == 'Windows'` — a condition that is false on every run of this job,
      # so the 13 tests never executed anywhere. The Tauri shell is Windows-only and its
      # linux dep tree needs GTK, so the tests moved to the `tauri-test` job below, which
      # runs on windows-latest and supplies the one generated input they need.

  # v1.4.3 review #28: tauri.conf.json declares ../pkg-runtime.zip as a bundle RESOURCE, and
  # tauri-build resolves it while generating the context — so `cargo test --locked` on a clean
  # checkout died with "resource path ..\pkg-runtime.zip doesn't exist" before a single test
  # ran. The reviewer was right that the 13/13 record was not a reproducible gate. This job
  # creates a placeholder zip (the tests never open it), then runs the suite on the OS the
  # shell actually targets.
  tauri-test:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Provide the bundle resource tauri-build resolves
        shell: pwsh
        run: |
          # the real zip is produced by the build job; the unit tests never read it, but
          # tauri-build fails the whole compilation when the declared resource is absent
          if (-not (Test-Path pkg-runtime.zip)) {
            $fs = [System.IO.File]::Create((Join-Path (Get-Location) 'pkg-runtime.zip'))
            $fs.Close()
          }
          Get-Item pkg-runtime.zip | Select-Object Name, Length
      - name: Rust unit tests (tauri shell)
        run: cargo test --locked
        working-directory: tauri

  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # v1.4.2 review (E1): --omit=dev skipped @earendil-works/pi-coding-agent, so the one
      # test that runs a REAL pi child (ws adopt) skipped on every matrix runner; the whole
      # suite's deepest coverage only existed in the e2e job. Full install now.
      - run: npm ci
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check electron-main.cjs
          node --check public/app.js
          node --check public/dropdowns.js
          node --check extensions/mcp-bridge.js
      - name: API tests
        run: npm test
      - name: Route sweep (all routes, sane payloads)
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/route-sweep.py

  # v1.4.3 review #32: every browser probe ran on ubuntu-latest only, so the Windows
  # Electron/Tauri WebView and the macOS WebView — the shells users actually install — had no
  # rendered-behaviour coverage at all. The FULL probe set still runs here (it needs the
  # linux-only extras), and `e2e-cross-os` below runs the probes that exercise real
  # rendering and real API contracts on the two other operating systems.
  e2e:
    timeout-minutes: 25
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: WS integration probe (real pi child through the full chain)
        run: node scripts/ws-probe.mjs
      - name: Failover chain probe (real pi, 3 mock providers)
        run: node scripts/failover-e2e.mjs
      - name: Audit fix contracts (cron budget/rotation, failover env names, restore grafting, tree cycle)
        run: node scripts/verify-audit-fixes.mjs
      - name: UI probe (headless Chromium via CDP)
        run: |
          # P3-25: playwright is an exact devDependency now, so `npm ci` above is
          # what pins the version — `npx -y playwright@1.49.1` resolved and
          # installed an unpinned package at run time. The browser binary still
          # comes from Playwright's CDN (no hash in the lockfile); only the
          # driver is reproducible.
          npx playwright install --with-deps chromium
          CHROME_EXE=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)
          echo "chrome: $CHROME_EXE"
          CHROME_EXE="$CHROME_EXE" node scripts/ui-probe.mjs
          CHROME_EXE="$CHROME_EXE" node scripts/chat-e2e.mjs
          CHROME_EXE="$CHROME_EXE" node scripts/ui-contract-probe.mjs
          # P3-20: the front end had no automated test at all — this one asserts the
          # keyboard menu, the responsive rail width and the offline-queue draft
          # survival in a real browser (all three are rendered behaviour, not source text)
          CHROME_EXE="$CHROME_EXE" node scripts/ui-a11y-probe.mjs

  e2e-cross-os:
    timeout-minutes: 30
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the probes
        run: npx playwright install chromium
      # the probes default to a hard-coded Windows build path; on macOS that path cannot
      # exist, so the browser location is resolved from the pinned playwright and exported
      - name: Locate the Chromium binary
        shell: bash
        run: |
          exe=$(node -e "console.log(require('playwright').chromium.executablePath())")
          echo "chromium: $exe"
          if [ ! -f "$exe" ]; then echo "::error::playwright chromium not found at $exe"; exit 1; fi
          echo "CHROME_EXE=$exe" >> "$GITHUB_ENV"
      - name: UI probe (rendered panels, real Chromium)
        run: node scripts/ui-probe.mjs
      - name: UI contract probe (extension UI round-trip)
        run: node scripts/ui-contract-probe.mjs
      - name: UI a11y probe (keyboard menu, responsive rail)
        run: node scripts/ui-a11y-probe.mjs
      - name: Upload probe artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-probe-${{ matrix.os }}
          path: |
            scripts/__shots__/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    timeout-minutes: 60
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    needs: [lint, tauri-test, test, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install build deps
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assemble runtime (pi + server + public)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg-build | Out-Null
          # install the pinned runtime set in a neutral dir: npm hoists nested installs
          # into an ancestor project's node_modules, which would wipe electron
          $rt = Join-Path $env:RUNNER_TEMP 'piwb-runtime'
          New-Item -ItemType Directory -Force $rt | Out-Null
          Copy-Item runtime-package.json -Destination (Join-Path $rt 'package.json')
          Copy-Item runtime-package-lock.json -Destination (Join-Path $rt 'package-lock.json')
          Push-Location $rt
          npm ci --omit=dev --no-fund --no-audit
          Pop-Location
          New-Item -ItemType Directory -Force pkg-build | Out-Null
          Copy-Item -Recurse -Force (Join-Path $rt 'node_modules') pkg-build/node_modules
          Copy-Item runtime-package.json -Destination pkg-build/package.json
          Copy-Item runtime-package-lock.json -Destination pkg-build/package-lock.json
          Copy-Item server.mjs pkg-build/server.mjs
          Copy-Item zip.mjs pkg-build/zip.mjs
          Copy-Item electron-main.cjs pkg-build/electron-main.cjs
          Copy-Item lib pkg-build/lib -Recurse -Force
          Copy-Item data pkg-build/data -Recurse -Force
          Copy-Item ledger.mjs pkg-build/ledger.mjs
          Copy-Item extensions pkg-build/extensions -Recurse -Force
          robocopy public pkg-build/public /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit 1 }
          Invoke-WebRequest -Uri "https://nodejs.org/dist/${{ env.NODE_BUNDLE_VERSION }}/win-x64/node.exe" -OutFile pkg-build/node.exe
          Invoke-WebRequest -Uri "https://nodejs.org/dist/${{ env.NODE_BUNDLE_VERSION }}/SHASUMS256.txt" -OutFile pkg-build/SHASUMS256.txt
          $expected = (Select-String -Path pkg-build/SHASUMS256.txt -Pattern ([regex]::Escape("win-x64/node.exe"))).Line.Split(' ')[0].Trim()
          $actual = (Get-FileHash pkg-build/node.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'bundled node.exe SHA-256 mismatch' }
          Remove-Item pkg-build/SHASUMS256.txt
          node scripts/pin-runtime-deps.mjs pkg-build
          Set-Location pkg-build
          node ../scripts/write-manifest.mjs
          Set-Location ..
          node scripts/make-runtime.mjs
      - name: Runtime import self-check
        run: node scripts/check-runtime.mjs
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build Tauri app
        shell: pwsh
        run: |
          cargo --version
          cd tauri
          # P3-16 (v1.3.9 review): `npx tauri build` lets cargo UPDATE Cargo.lock in place when
          # the manifest drifted, so the tree audited by `cargo audit --file tauri/Cargo.lock`
          # and the tree actually compiled could differ. --locked turns that silent refresh into
          # a build failure — which is the whole point of auditing a committed lock.
          npx tauri build -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tauri-installer
          path: tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer
          path: dist_electron/*.exe
          retention-days: 7

  build-linux:
    timeout-minutes: 50
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install build deps
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assemble runtime (pi + server + public)
        run: |
          # install the pinned runtime set in a neutral dir: npm hoists nested installs
          # into an ancestor project's node_modules, which would wipe electron
          rt="$RUNNER_TEMP/piwb-runtime"
          mkdir -p "$rt"
          cp runtime-package.json "$rt/package.json"
          cp runtime-package-lock.json "$rt/package-lock.json"
          cd "$rt" && npm ci --omit=dev --no-fund --no-audit && cd -
          mkdir -p pkg-build
          cp -r "$rt/node_modules" pkg-build/node_modules
          cp runtime-package.json pkg-build/package.json
          cp runtime-package-lock.json pkg-build/package-lock.json
          cp server.mjs zip.mjs electron-main.cjs ledger.mjs pkg-build/
          cp -r lib pkg-build/lib
          cp -r data pkg-build/data
          cp -r extensions pkg-build/extensions
          mkdir -p pkg-build/public
          cp -r public/. pkg-build/public/
          curl -fsSL "https://nodejs.org/dist/${{ env.NODE_BUNDLE_VERSION }}/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          curl -fsSL "https://nodejs.org/dist/${{ env.NODE_BUNDLE_VERSION }}/node-${{ env.NODE_BUNDLE_VERSION }}-linux-x64.tar.xz" -o "/tmp/node-${{ env.NODE_BUNDLE_VERSION }}-linux-x64.tar.xz"
          cd /tmp && grep "  node-${{ env.NODE_BUNDLE_VERSION }}-linux-x64.tar.xz$" SHASUMS256.txt | sha256sum -c - && cd -
          tar -xJf "/tmp/node-${{ env.NODE_BUNDLE_VERSION }}-linux-x64.tar.xz" -C /tmp "node-${{ env.NODE_BUNDLE_VERSION }}-linux-x64/bin/node"
          cp "/tmp/node-${{ env.NODE_BUNDLE_VERSION }}-linux-x64/bin/node" pkg-build/node
          chmod +x pkg-build/node
          node scripts/pin-runtime-deps.mjs pkg-build
          cd pkg-build && node ../scripts/write-manifest.mjs && cd ..
          node scripts/make-runtime.mjs
      - name: Runtime import self-check
        run: node scripts/check-runtime.mjs
      - name: SBOM (CycloneDX over the shipped runtime deps)
        run: |
          node scripts/sbom.mjs pkg-build > sbom-pi-workbench.cdx.json
          node scripts/assert-sbom-pins.mjs sbom-pi-workbench.cdx.json
      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Smoke test AppImage structure
        run: |
          f=(dist_electron/*.AppImage)
          chmod +x "${f[0]}"
          "${f[0]}" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          echo 'AppImage structure verified (AppRun executable)'
      - name: Boot test - shipped AppImage must serve the panel
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 xvfb curl
          echo '--- extraction tools available:'
          for t in unzip bsdtar python3; do command -v "$t" >/dev/null 2>&1 && echo "$t: yes" || echo "$t: NO"; done
          f=(dist_electron/*.AppImage)
          chmod +x "${f[0]}"
          # v1.4.3 review #37: `|| true` here (and the printed-but-ignored unzip status)
          # meant a failed extraction still produced a "BOOT VERIFIED" line as long as some
          # process answered 200 on the port. Both steps are gates now.
          if ! "${f[0]}" --appimage-extract > /tmp/appimage-extract.log 2>&1; then
            echo '::error::appimage-extract failed'
            tail -20 /tmp/appimage-extract.log
            exit 1
          fi
          RZ=squashfs-root/resources/runtime.zip
          ls -la "$RZ"
          test -f "$RZ" || { echo '::error::the AppImage carries no resources/runtime.zip'; exit 1; }
          rm -rf /tmp/rzprobe
          if ! unzip -o "$RZ" -d /tmp/rzprobe > /tmp/unzip-probe.log 2>&1; then
            echo '::error::the bundled runtime.zip did not extract'
            tail -20 /tmp/unzip-probe.log
            exit 1
          fi
          test -f /tmp/rzprobe/manifest.json || { echo '::error::extracted runtime has no manifest.json'; exit 1; }
          echo "runtime.zip extracted: $(find /tmp/rzprobe -type f | wc -l) files"
          export PIWB_TOKEN=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          # the runtime zip now carries node_modules (~430MB / 14k files): AppImage
          # extraction + runtime extraction + manifest verify need minutes — 180s killed
          # the shell mid-extract (the old window never saw a live process to poll)
          timeout 900 xvfb-run -a "${f[0]}" --appimage-extract-and-run > /tmp/app.log 2>&1 &
          APP_PID=$!   # v1.4.3 review #37: kill OUR pid, never `pkill -f` a command line
          ok=0
          for i in $(seq 1 700); do # the runtime zip now carries node_modules — extraction+verify of ~2700 files needs minutes, not the old 150s
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:32123/ || true)
            echo "poll $i: $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" = "1" ]; then
            if curl -s http://127.0.0.1:32123/ | grep -q '__API_TOKEN'; then echo 'SECURITY FAILED: token leaked in served HTML'; ok=0; fi
            tok=$PIWB_TOKEN
            piv=$(curl -s -H "x-api-token: $tok" http://127.0.0.1:32123/api/kernel | grep -o '"pi":"[^"]*"' || true)
            echo "kernel pi field: $piv"
            if [ -z "$piv" ]; then echo 'KERNEL CHECK FAILED: bundled pi missing from /api/kernel'; ok=0; fi
            ep=$(curl -s -H "x-api-token: $tok" http://127.0.0.1:32123/api/kernel | grep -o '"execPath":"[^"]*"' | head -1)
            echo "serving node: $ep"
            nm=$(stat -c '%a' "$HOME/.config/Pi Workbench/runtime/node" 2>/dev/null || echo missing)
            echo "bundled node mode: $nm"
            case "$ep" in *runtime/node*) echo 'BUNDLED NODE SERVING CONFIRMED' ;; *) echo 'KERNEL CHECK FAILED: the bundled node is not the one serving'; ok=0 ;; esac
          fi
          # kill the process group we started (xvfb-run wraps the app), falling back to bare kill
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          pkill -P "$APP_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo 'BOOT FAILED - panel never answered 200'
            echo '--- node/electron processes still alive:'
            ps aux | grep -E 'node|electron|appimage' | grep -v grep || echo '(none)'
            echo '--- electron server.log (appendLog forensics):'
            cat "$HOME/.config/Pi Workbench/server.log" 2>/dev/null || echo '(no server.log)'
            echo '--- runtime dir:'
            ls -la "$HOME/.config/Pi Workbench/runtime" 2>/dev/null | head -8 || echo '(no runtime dir)'
            echo '--- node locations:'
            ls -la /usr/bin/node /usr/local/bin/node 2>/dev/null | head -4 || true
            echo '--- disk space:'
            df -h /home /tmp || true
            echo '--- full app.log (first 120 lines):'
            head -120 /tmp/app.log
            exit 1
          fi
          echo 'BOOT VERIFIED: the shipped AppImage served the panel (HTTP 200)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage
          path: dist_electron/*.AppImage
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom-pi-workbench.cdx.json
          retention-days: 90

  build-mac:
    timeout-minutes: 50
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    needs: [lint, test, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install build deps
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Assemble runtime (pi + server + public)
        run: |
          # install the pinned runtime set in a neutral dir: npm hoists nested installs
          # into an ancestor project's node_modules, which would wipe electron
          rt="$RUNNER_TEMP/piwb-runtime"
          mkdir -p "$rt"
          cp runtime-package.json "$rt/package.json"
          cp runtime-package-lock.json "$rt/package-lock.json"
          cd "$rt" && npm ci --omit=dev --no-fund --no-audit && cd -
          mkdir -p pkg-build
          cp -r "$rt/node_modules" pkg-build/node_modules
          cp runtime-package.json pkg-build/package.json
          cp runtime-package-lock.json pkg-build/package-lock.json
          cp server.mjs zip.mjs electron-main.cjs ledger.mjs pkg-build/
          cp -r lib pkg-build/lib
          cp -r data pkg-build/data
          cp -r extensions pkg-build/extensions
          mkdir -p pkg-build/public
          cp -r public/. pkg-build/public/
      - name: Bundle a per-architecture Node runtime (P1-1)
        run: |
          # v1.3.8 review P1-1: one darwin-x64 node was packed into BOTH the arm64 and
          # the x64 dmg, so the arm64 build could not start without Rosetta 2. Each dmg
          # now carries the Node build for its own architecture, and the arch is
          # asserted before the zip is made instead of being assumed.
          set -euo pipefail
          v="${{ env.NODE_BUNDLE_VERSION }}"
          curl -fsSL "https://nodejs.org/dist/$v/SHASUMS256.txt" -o /tmp/SHASUMS256.txt
          for arch in arm64 x64; do
            # lipo spells the x64 slice "x86_64", not "x64" — comparing the literal
            # arch name failed every x64 build with "bundled node is not x64".
            case "$arch" in arm64) want=arm64 ;; x64) want=x86_64 ;; esac
            tarball="node-$v-darwin-$arch.tar.xz"
            curl -fsSL "https://nodejs.org/dist/$v/$tarball" -o "/tmp/$tarball"
            ( cd /tmp && grep "  $tarball\$" SHASUMS256.txt | sha256sum -c - )
            tar -xJf "/tmp/$tarball" -C /tmp "node-$v-darwin-$arch/bin/node"
            cp "/tmp/node-$v-darwin-$arch/bin/node" pkg-build/node
            chmod +x pkg-build/node
            got="$(lipo -archs pkg-build/node)"
            echo "bundling node arch=$arch (lipo: $got, want $want)"
            case "$got" in
              *"$want"*) ;;
              *) echo "::error::bundled node is not $want (lipo: $got)"; exit 1 ;;
            esac
            node scripts/pin-runtime-deps.mjs pkg-build
            ( cd pkg-build && node ../scripts/write-manifest.mjs )
            node scripts/make-runtime.mjs
            cp pkg-runtime.zip "pkg-runtime-$arch.zip"
          done
      - name: Runtime import self-check
        run: node scripts/check-runtime.mjs
      - name: Build macOS dmg (arm64 + x64, one runtime each)
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            cp "pkg-runtime-$arch.zip" pkg-runtime.zip
            npx electron-builder --mac dmg --"$arch" --publish never
          done
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify each dmg carries its own architecture (P1-1)
        run: |
          # the claim is "the arm64 dmg runs without Rosetta" — prove it on the artifact
          set -euo pipefail
          for arch in arm64 x64; do
            case "$arch" in arm64) want=arm64 ;; x64) want=x86_64 ;; esac
            if [ "$arch" = arm64 ]; then dmg="$(ls dist_electron/*-arm64.dmg)"; else dmg="$(ls dist_electron/*.dmg | grep -v -- -arm64.dmg)"; fi
            echo "== $dmg"
            mnt="$RUNNER_TEMP/mnt-$arch"
            rm -rf "$mnt"; mkdir -p "$mnt"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            app="$(ls -d "$mnt"/*.app | head -1)"
            rt="$app/Contents/Resources/runtime.zip"
            test -f "$rt"
            rm -rf "/tmp/rt-$arch"; mkdir -p "/tmp/rt-$arch"
            ditto -x -k "$rt" "/tmp/rt-$arch"
            got="$(lipo -archs "/tmp/rt-$arch/node")"
            echo "runtime node inside the $arch dmg: $got (want $want)"
            hdiutil detach "$mnt" >/dev/null
            case "$got" in
              *"$want"*) ;;
              *) echo "::error::$arch dmg bundles the wrong node (lipo: $got, want $want)"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-dmg
          path: dist_electron/*.dmg
          retention-days: 7
