[package]
name = "pi-workbench"
version = "1.2.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
